# Weekly dependency-update PRs for ecosystems in the repo: the frontend/e2e npm packages, the
# backend's Gradle dependencies, and the agent-ingest Go module.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
