# Weekly dependency-update PRs for ecosystems in the repo: the frontend/e2e npm packages and the
# root Go module (which builds both agy-brain-viz and agent-ingest).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
